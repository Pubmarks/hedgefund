name: Ticker research

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Stock ticker symbol (e.g. AAPL)
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  research:
    name: Research ${{ inputs.ticker }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Normalize ticker
        id: ticker
        run: |
          raw='${{ inputs.ticker }}'
          ticker="$(printf '%s' "$raw" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          if [ -z "$ticker" ]; then
            echo "Ticker must be non-empty" >&2
            exit 1
          fi
          echo "value=$ticker" >> "$GITHUB_OUTPUT"
          echo "Researching ticker: $ticker"

      - name: Image name
        id: image
        run: |
          name="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${name}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image
        run: podman pull "${{ steps.image.outputs.ref }}"

      - name: Run research
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          ticker="${{ steps.ticker.outputs.value }}"
          image="${{ steps.image.outputs.ref }}"
          mkdir -p out
          # Rootless podman remaps uids, so bind-mounting ./out as /out often
          # Permission-denies writes from USER app (10001). Write inside the
          # container instead, then copy the file out.
          cid="$(podman create \
            -e OPENCODE_API_KEY \
            -e OPENCODE_DISABLE_DEFAULT_PLUGINS=1 \
            -e OPENCODE_PURE=1 \
            "${image}" \
            "${ticker}" \
            -o "/tmp/${ticker}.md")"
          trap 'podman rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          podman start -a "${cid}"
          podman cp "${cid}:/tmp/${ticker}.md" "out/${ticker}.md"

      - name: Publish summary
        run: |
          summary="out/${{ steps.ticker.outputs.value }}.md"
          if [ ! -s "$summary" ]; then
            echo "Missing or empty summary at $summary" >&2
            exit 1
          fi
          {
            echo "## Ticker research: ${{ steps.ticker.outputs.value }}"
            echo
            cat "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload markdown artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticker-${{ steps.ticker.outputs.value }}
          path: out/${{ steps.ticker.outputs.value }}.md
          if-no-files-found: error
