name: Ticker research

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Stock ticker symbol (e.g. AAPL)
        required: true
        type: string
      debate_rounds:
        description: Bull/Bear debate rounds (1-3)
        required: false
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
        default: "1"
      risk_rounds:
        description: Risk analyst discussion rounds (1-3)
        required: false
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
        default: "1"
      image_tag:
        description: Container image tag (e.g. latest, sha-abc1234)
        required: false
        type: string
        default: latest

permissions:
  contents: read
  packages: read

jobs:
  research:
    name: Research ${{ inputs.ticker }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Normalize ticker
        id: ticker
        run: |
          raw='${{ inputs.ticker }}'
          ticker="$(printf '%s' "$raw" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          if [ -z "$ticker" ]; then
            echo "Ticker must be non-empty" >&2
            exit 1
          fi
          echo "value=$ticker" >> "$GITHUB_OUTPUT"
          echo "Researching ticker: $ticker"

      - name: Image name
        id: image
        run: |
          name="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          tag='${{ inputs.image_tag }}'
          tag="$(printf '%s' "$tag" | tr -d '[:space:]')"
          if [ -z "$tag" ]; then
            tag=latest
          fi
          echo "ref=ghcr.io/${name}:${tag}" >> "$GITHUB_OUTPUT"
          echo "Using image: ghcr.io/${name}:${tag}"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image
        run: podman pull "${{ steps.image.outputs.ref }}"

      - name: Run research
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          HEDGEFUND_QUICK_MODEL: ${{ vars.HEDGEFUND_QUICK_MODEL }}
          HEDGEFUND_DEEP_MODEL: ${{ vars.HEDGEFUND_DEEP_MODEL }}
          HEDGEFUND_EPIC_MODEL: ${{ vars.HEDGEFUND_EPIC_MODEL }}
        run: |
          set -euo pipefail
          ticker="${{ steps.ticker.outputs.value }}"
          image="${{ steps.image.outputs.ref }}"
          mkdir -p out
          # Rootless podman remaps uids, so bind-mounting ./out as /out often
          # Permission-denies writes from USER app (10001). Write inside the
          # container instead, then copy the file out.
          cid="$(podman create \
            -e OPENCODE_API_KEY \
            -e OPENROUTER_API_KEY \
            -e FRED_API_KEY \
            -e HEDGEFUND_QUICK_MODEL \
            -e HEDGEFUND_DEEP_MODEL \
            -e HEDGEFUND_EPIC_MODEL \
            -e OPENCODE_DISABLE_DEFAULT_PLUGINS=1 \
            -e OPENCODE_PURE=1 \
            "${image}" \
            "${ticker}" \
            --debate-rounds '${{ inputs.debate_rounds }}' \
            --risk-rounds '${{ inputs.risk_rounds }}')"
          trap 'podman rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          podman start -a "${cid}"
          mkdir -p "out/${ticker}"
          podman cp "${cid}:/app/out/${ticker}/." "out/${ticker}/"

      - name: Publish summary
        run: |
          ticker="${{ steps.ticker.outputs.value }}"
          summary="out/${ticker}/final-report.md"
          if [ ! -s "$summary" ]; then
            echo "Missing or empty summary at $summary" >&2
            exit 1
          fi
          {
            echo "## Ticker research: ${ticker}"
            echo
            cat "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticker-${{ steps.ticker.outputs.value }}
          path: out/${{ steps.ticker.outputs.value }}/
          if-no-files-found: error
